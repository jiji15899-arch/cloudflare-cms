# CloudPress CMS — Cloudflare Workers 배포 설정 v5.4
# Originless Edge CMS: Edge Cache + KV 이중 캐시 + SWR/ISR + Prewarm + Purge + Failover
#
# ── 최초 배포 순서 ─────────────────────────────────────────────────
#  1. D1 생성:    npx wrangler d1 create cloudpress-db
#  2. KV 생성:    npx wrangler kv:namespace create CP_KV
#  3. ID 교체:    아래 database_id / kv id 를 실제 값으로 교체
#  4. 시크릿:     npx wrangler secret put CP_AUTH_KEY
#  5. DB 초기화:  npx wrangler d1 execute cloudpress-db --file=schema.sql --remote
#  6. 배포:       npx wrangler deploy
#  7. 설치:       https://<worker>.workers.dev/cp-admin/setup-config
#     (재배포 시 설치 화면 없음 — KV 잠금으로 /cp-admin 리다이렉트)
#
# ── 캐시 관리 ────────────────────────────────────────────────────
#  전체 Purge:  POST /__edge/purge?type=all   -H "X-Purge-Key: <AUTH_KEY>"
#  포스트 Purge: POST /__edge/purge?type=post&path=/2024/01/slug
#  Prewarm:     POST /__edge/prewarm          -H "X-Purge-Key: <AUTH_KEY>"
#  상태 확인:   GET  /__edge/health
#
# ── v5.4 에러 수정 내용 ──────────────────────────────────────────
#  [10021] Unexpected end of input 원인:
#    이전 버전의 wrangler.toml에 [[rules]] type="ESModule"이 있어서
#    worker.js를 ESM으로 강제 인식했으나 실제로는 addEventListener
#    기반 Service Worker 포맷 → export default 없어 EOF에서 에러 발생
#
#  수정 사항:
#    1. worker.js 끝: addEventListener 블록 제거
#                     → export default worker_default (ESM 표준)
#    2. wrangler.toml: [build] + [[rules]] 섹션 완전 제거
#       wrangler가 export default 감지 시 자동 ESM 처리
#    3. TOML 섹션 순서 정리 (env.staging이 [[rules]] 사이에 끼어 파싱 오류)
# ─────────────────────────────────────────────────────────────────

name               = "cloudflare-cms"
main               = "worker.js"
compatibility_date = "2024-09-23"
node_compat        = false

# ── D1 Database ───────────────────────────────────────────────────
[[d1_databases]]
binding       = "CP_DB"
database_name = "cloudpress-db"
database_id   = "YOUR_D1_DATABASE_ID_HERE"

# ── KV Namespace ─────────────────────────────────────────────────
[[kv_namespaces]]
binding = "CP_KV"
id      = "YOUR_KV_NAMESPACE_ID_HERE"

# ── 환경 변수 ─────────────────────────────────────────────────────
[vars]
CP_SITE_NAME    = "My CloudPress Site"
CP_SITE_TAGLINE = "Just another CloudPress site"

# ── Smart Placement: 요청 발원지에 가장 가까운 PoP에서 실행 ──────
[placement]
mode = "smart"

# ── Cron: 만료 KV 캐시 정리 (5분마다) ───────────────────────────
[triggers]
crons = ["*/5 * * * *"]

# ── Production 환경 ───────────────────────────────────────────────
[env.production]
name = "cloudflare-cms-production"

[env.production.vars]
CP_SITE_NAME    = "My CloudPress Site"
CP_SITE_TAGLINE = "Just another CloudPress site"

# ── Staging 환경 ──────────────────────────────────────────────────
[env.staging]
name = "cloudflare-cms-staging"

[env.staging.vars]
CP_SITE_NAME    = "My CloudPress Site (Staging)"
CP_SITE_TAGLINE = "Staging environment"
