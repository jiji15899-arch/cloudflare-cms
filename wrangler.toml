# CloudPress CMS — Cloudflare Workers 배포 설정 v5.0
# Originless Edge CMS: Edge Cache + KV 이중 캐시 + SWR/ISR + Prewarm + Purge + Failover
#
# ── 최초 배포 순서 ─────────────────────────────────────────────────
#  1. D1 생성:    npx wrangler d1 create cloudpress-db
#  2. KV 생성:    npx wrangler kv:namespace create CP_KV
#  3. ID 교체:    아래 database_id / kv id 를 실제 값으로 교체
#  4. 시크릿:     npx wrangler secret put CP_AUTH_KEY
#  5. 배포:       npx wrangler deploy
#  6. 설치:       https://<worker>.workers.dev/cp-admin/setup-config
#  7. (선택) Prewarm: curl -X POST https://<site>/__edge/prewarm \
#                       -H "X-Purge-Key: <AUTH_KEY>"
#
# ── 재배포 시 ────────────────────────────────────────────────────
#  - 설치 화면은 다시 뜨지 않음 (KV cp:installed_lock 으로 영구 잠금)
#  - 캐시 무효화: POST /__edge/purge?type=all  -H "X-Purge-Key: <key>"
# ─────────────────────────────────────────────────────────────────

name               = "cloudflare-cms"
main               = "worker.js"
compatibility_date = "2024-09-23"

# ── D1 Database (쓰기 전용 — 읽기는 KV 캐시) ─────────────────────
[[d1_databases]]
binding       = "CP_DB"
database_name = "cloudpress-db"
database_id   = "YOUR_D1_DATABASE_ID_HERE"

# ── KV Namespace (이중 캐시 레이어 + 설치 잠금) ───────────────────
[[kv_namespaces]]
binding = "CP_KV"
id      = "YOUR_KV_NAMESPACE_ID_HERE"

# ── 환경 변수 ────────────────────────────────────────────────────
[vars]
CP_SITE_NAME    = "My CloudPress Site"
CP_SITE_TAGLINE = "Just another CloudPress site"

# ── Smart Placement: 요청 발원지 PoP에서 실행 ─────────────────────
[placement]
mode = "smart"

# ── Cron: 만료 캐시 정리 + 기존 cron ────────────────────────────
[triggers]
crons = ["*/5 * * * *"]

# ── HTTP Cache 헤더 규칙 (Cloudflare Cache Rules 보완) ─────────────
# 프론트엔드 정적 자산 장기 캐시
[[rules]]
type = "ESModule"

# ── Production 환경 ──────────────────────────────────────────────
[env.production]
name = "cloudflare-cms-production"

[env.production.vars]
CP_SITE_NAME = "My CloudPress Site"

[env.staging]
name = "cloudflare-cms-staging"
